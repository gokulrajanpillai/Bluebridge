name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Coverage gate (internal/azure + internal/server >= 70%)
        run: |
          go test ./internal/azure/... ./internal/server/... \
            -covermode=atomic -coverprofile=core.out
          pct=$(go tool cover -func=core.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Core coverage: ${pct}%"
          awk "BEGIN{ exit !(${pct} >= 70) }" || {
            echo "::error::core coverage ${pct}% is below the 70% gate"; exit 1;
          }

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type check & build
        working-directory: web
        run: npm run build

  build-smoke:
    name: Build smoke test
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        run: make build

      - name: Version smoke test
        run: ./bluebridge --version

      - name: Server smoke test (/healthz)
        run: |
          ./bluebridge --no-browser --port 8765 &
          SERVER_PID=$!
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/healthz; then ok=1; break; fi
            sleep 0.5
          done
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "healthz never responded"; exit 1; fi
