name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Build jobs (run in parallel) ────────────────────────────────────────────

  build-windows:
    name: Build / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Build
        env:
          PYTHONUTF8: "1"
        run: python build.py windows

      - name: Zip artefact
        shell: pwsh
        run: Compress-Archive -Path build\windows\* -DestinationPath bluebridge-windows.zip

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: bluebridge-windows
          path: bluebridge-windows.zip
          if-no-files-found: error

  build-macos:
    name: Build / macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Build
        run: python build.py macos

      - name: Zip app bundle
        run: |
          # ditto preserves symlinks; zip -r would follow recursive symlinks
          # inside the bundle and inflate the archive to unusable sizes.
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/BlueBridge.app bluebridge-macos.zip

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: bluebridge-macos
          path: bluebridge-macos.zip
          if-no-files-found: error

  build-linux:
    name: Build / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Build
        run: python build.py linux

      - name: Tar artefact
        run: tar -czf bluebridge-linux.tar.gz -C build/linux .

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: bluebridge-linux
          path: bluebridge-linux.tar.gz
          if-no-files-found: error

  # ── Release job ─────────────────────────────────────────────────────────────

  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        run: |
          SEMVER="${{ steps.version.outputs.VERSION }}"
          SEMVER="${SEMVER#v}"
          awk "/^## \[${SEMVER}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release_notes.md
          echo "Notes for ${SEMVER}:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BlueBridge ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/bluebridge-windows/bluebridge-windows.zip
            dist/bluebridge-macos/bluebridge-macos.zip
            dist/bluebridge-linux/bluebridge-linux.tar.gz
