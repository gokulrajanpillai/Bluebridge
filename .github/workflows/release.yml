name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # Windows and Linux binaries are cgo-free and cross-compile from one
  # Ubuntu runner.
  build:
    name: Build / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build binaries (server + CLI)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.VERSION }}"
          go build -ldflags "$LDFLAGS" -o "bluebridge-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/bluebridge
          go build -ldflags "$LDFLAGS" -o "bluebridge-cli-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/bluebridge-cli

      - name: Package
        run: |
          mkdir -p out
          VERSION="${{ steps.version.outputs.VERSION }}"
          for app in bluebridge bluebridge-cli; do
            BIN="${app}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
            NAME="${app}-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
            if [ "${{ matrix.goos }}" = "windows" ]; then
              zip "out/${NAME}.zip" "$BIN"
            else
              tar -czf "out/${NAME}.tar.gz" "$BIN"
            fi
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  # macOS Keychain persistence (internal/auth/persistent_cache.go) needs
  # cgo, which requires the native Apple SDK — so darwin binaries build
  # natively per-arch on macos-latest rather than cross-compiling.
  build-darwin:
    name: Build / darwin-${{ matrix.goarch }}
    needs: build-web
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build binaries (server + CLI)
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.VERSION }}"
          go build -ldflags "$LDFLAGS" -o "bluebridge-darwin-${GOARCH}" ./cmd/bluebridge
          go build -ldflags "$LDFLAGS" -o "bluebridge-cli-darwin-${GOARCH}" ./cmd/bluebridge-cli

      - name: Package
        run: |
          mkdir -p out
          VERSION="${{ steps.version.outputs.VERSION }}"
          for app in bluebridge bluebridge-cli; do
            NAME="${app}-${VERSION}-darwin-${{ matrix.goarch }}"
            tar -czf "out/${NAME}.tar.gz" "${app}-darwin-${{ matrix.goarch }}"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        run: |
          SEMVER="${{ steps.version.outputs.VERSION }}"
          SEMVER="${SEMVER#v}"
          awk "/^## \[${SEMVER}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release_notes.md
          echo "Notes for ${SEMVER}:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BlueBridge ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*
