name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # Windows and Linux binaries are cgo-free and cross-compile from one
  # Ubuntu runner.
  build:
    name: Build / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o "bluebridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/bluebridge

      - name: Package
        run: |
          NAME="bluebridge-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          BIN="bluebridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${NAME}.zip" "$BIN"
            echo "ARTIFACT=${NAME}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${NAME}.tar.gz" "$BIN"
            echo "ARTIFACT=${NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  # macOS Keychain persistence (internal/auth/persistent_cache.go) needs
  # cgo, which requires the native Apple SDK — so darwin binaries build
  # natively per-arch on macos-latest rather than cross-compiling.
  build-darwin:
    name: Build / darwin-${{ matrix.goarch }}
    needs: build-web
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o "bluebridge-darwin-${{ matrix.goarch }}" \
            ./cmd/bluebridge

      - name: Package
        run: |
          NAME="bluebridge-${{ steps.version.outputs.VERSION }}-darwin-${{ matrix.goarch }}"
          tar -czf "${NAME}.tar.gz" "bluebridge-darwin-${{ matrix.goarch }}"
          echo "ARTIFACT=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: bluebridge-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        run: |
          SEMVER="${{ steps.version.outputs.VERSION }}"
          SEMVER="${SEMVER#v}"
          awk "/^## \[${SEMVER}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release_notes.md
          echo "Notes for ${SEMVER}:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BlueBridge ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*
