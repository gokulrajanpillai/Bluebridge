default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # ── File hygiene ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]          # allow custom tags (GitHub Actions uses them)
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key    # quick built-in key pattern check

  # ── Secret scanning (gitleaks) ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # ── Linting + formatting (ruff) ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff                  # lint + auto-fix
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format           # formatter (replaces black)

  # ── Type checking (mypy) ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          - flet>=0.27.0
          - httpx>=0.27.0
        args:
          - --config-file=pyproject.toml

  # ── Security SAST (bandit) ────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        # Exclude test fixtures and build artefacts
        exclude: ^(build|dist|\.venv)/

  # ── Advanced SAST (semgrep) ───────────────────────────────────────────────
  - repo: https://github.com/semgrep/semgrep
    rev: v1.124.0
    hooks:
      - id: semgrep
        args:
          - --config=p/python
          - --config=p/secrets
          - --config=p/bandit
          - --error
          - --quiet
        exclude: ^(build|dist|\.venv)/

  # ── Commit message format ─────────────────────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
