[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluebridge"
version = "0.5.0"
description = "Azure Navigator — navigate Azure faster than the portal"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.27.0,<0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "invoke",
    "pre-commit",
    "mypy",
    "bandit[toml]",
    "semgrep",
]

[project.scripts]
bluebridge = "main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations (type hints)
]
ignore = [
    "ANN401",  # allow Any
    "S603",    # subprocess calls — intentional (az CLI wrapper)
    "S607",    # partial executable path — intentional
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["ANN"]           # entry point — annotations not required
"tasks.py" = ["ANN"]          # invoke task files don't need annotations
"app/views/*.py" = ["ANN"]    # Flet UI code, annotations cause noise
"app/components/*.py" = ["ANN"]  # Flet component code

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = false          # JSON-heavy services legitimately return Any
warn_unused_configs = true
ignore_missing_imports = true   # flet stubs not yet published
pretty = true

[[tool.mypy.overrides]]
module = ["flet.*", "httpx.*"]
ignore_missing_imports = true

# Flet UI code: stubs are incomplete, Ref[X].current is X|None everywhere,
# padding/border/alignment attrs are untyped — suppress rather than pollute.
[[tool.mypy.overrides]]
module = ["app.views.*", "app.components.*", "app.theme"]
ignore_errors = true

# ── Bandit ────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["build", "dist", ".venv"]
skips = [
    "B404",  # import subprocess — intentional (az CLI wrapper)
    "B603",  # subprocess without shell — intentional, args are controlled
    "B607",  # partial executable path — intentional
    "B110",  # try/except/pass — intentional in legitimate places
]

# ── flet build metadata ──────────────────────────────────────────────────────
[tool.flet]
app_name = "BlueBridge"
org = "com.bluebridge"
product = "BlueBridge"
description = "Azure Navigator — navigate Azure faster than the portal"
