[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluebridge"
version = "0.1.0"
description = "Azure Navigator — navigate Azure faster than the portal"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
