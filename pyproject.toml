[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluebridge"
version = "0.5.0"
description = "Azure Navigator — navigate Azure faster than the portal"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
bluebridge = "main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

# ── flet build metadata ──────────────────────────────────────────────────────
# Used by `flet build` / `python build.py` to produce native installers.
# Requires Flutter: https://docs.flutter.dev/get-started/install
[tool.flet]
app_name = "BlueBridge"
org = "com.bluebridge"
product = "BlueBridge"
description = "Azure Navigator — navigate Azure faster than the portal"
