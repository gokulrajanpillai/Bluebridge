[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluebridge"
version = "0.7.3"
description = "Azure PIM Access Manager"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "ruff",
    "mypy",
    "bandit[toml]",
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "S603",  # subprocess calls — intentional (az CLI wrapper)
    "S607",  # partial executable path — intentional
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["ANN", "S101"]
"launcher.py" = ["ANN"]
"build.py" = ["ANN", "S603", "S607"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
pretty = true

# ── Bandit ────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["build", "dist", ".venv"]
skips = [
    "B404",  # import subprocess — intentional (az CLI wrapper)
    "B603",  # subprocess without shell — intentional, args are controlled
    "B607",  # partial executable path — intentional
    "B110",  # try/except/pass — intentional in legitimate places
]
